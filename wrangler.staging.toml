name = "akron-upload-worker-staging"
main = "src/upload-worker-cloudflare.ts"
compatibility_date = "2026-07-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[triggers]
crons = ["17 4 * * *"]

[vars]
UPLOAD_TERMS_VERSION = "1"
UPLOAD_PUBLIC_BASE_URL = "https://akron-staging.micr.dev"
UPLOAD_PUBLIC_UPLOAD_BASE_URL = "https://akron-staging.micr.dev"

[[d1_databases]]
binding = "UPLOAD_DB"
database_name = "akron-uploads-staging"
# Wrangler provisions the staging database on the first deploy and writes its
# generated ID back to this file for later deploys.
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOAD_QUARANTINE_BUCKET"
bucket_name = "akron-upload-quarantine-staging"

[[r2_buckets]]
binding = "UPLOAD_PUBLIC_BUCKET"
bucket_name = "akron-community-packs-staging"

[[ratelimits]]
name = "UPLOAD_PREPARE_RATE_LIMITER"
namespace_id = "4107101"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "UPLOAD_OBJECT_RATE_LIMITER"
namespace_id = "4107102"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "UPLOAD_COMPLETE_RATE_LIMITER"
namespace_id = "4107103"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "UPLOAD_ATTRIBUTION_RATE_LIMITER"
namespace_id = "4107104"

  [ratelimits.simple]
  limit = 300
  period = 60

# Secrets:
# wrangler secret put BOT_HMAC_SECRET --config wrangler.staging.toml
