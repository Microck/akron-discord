name = "akron-upload-worker"
main = "src/upload-worker-cloudflare.ts"
compatibility_date = "2026-07-06"
compatibility_flags = ["nodejs_compat"]
account_id = "3bf786cef8d90ef18cad43350a9ed35c"
workers_dev = true
preview_urls = false

[triggers]
crons = ["17 4 * * *"]

[vars]
UPLOAD_TERMS_VERSION = "1"
UPLOAD_PUBLIC_BASE_URL = "https://akron.micr.dev"
UPLOAD_PUBLIC_UPLOAD_BASE_URL = "https://akron.micr.dev"

[[d1_databases]]
binding = "UPLOAD_DB"
database_name = "akron-uploads"
database_id = "2bd889d9-f2bc-4879-9302-aa361abde32e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOAD_QUARANTINE_BUCKET"
bucket_name = "akron-upload-quarantine"

[[r2_buckets]]
binding = "UPLOAD_PUBLIC_BUCKET"
bucket_name = "akron-community-packs"

[[ratelimits]]
name = "UPLOAD_PREPARE_RATE_LIMITER"
namespace_id = "4107001"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "UPLOAD_OBJECT_RATE_LIMITER"
namespace_id = "4107002"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "UPLOAD_COMPLETE_RATE_LIMITER"
namespace_id = "4107003"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "UPLOAD_ATTRIBUTION_RATE_LIMITER"
namespace_id = "4107004"

  [ratelimits.simple]
  limit = 300
  period = 60

# Secrets:
# wrangler secret put BOT_HMAC_SECRET --config wrangler.uploads.toml
